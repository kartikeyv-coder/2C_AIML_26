<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation in JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            padding: 30px;
            width: 450px;
            border: 2px solid grey;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            background-color: #fff;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .form input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3 class="header">Registration</h3>
        <form class="form" id="regForm">
            <label>
                Name: <input type="text" id="Name">
            </label>
            <label>
                Email: <input type="email" id="email">
            </label>
            <label>
                Password: <input type="password" id="password">
            </label>
            <label>
                Re-Enter Password: <input type="password" id="confirmPassword">
            </label>
            <label>
                Mobile: <input type="text" id="number">
            </label>
            <br>
            <button type="submit" id="btn">Submit</button>
        </form>
    </div>

    <script>
        const sumbit_btn = document.getElementById('btn');

        sumbit_btn.addEventListener('click', (e) => {
            e.preventDefault();

            let nameInput = document.getElementById('Name').value;
            let emailInput = document.getElementById('email').value;
            let passInput = document.getElementById('password').value;
            let confirmPassInput = document.getElementById('confirmPassword').value;
            let mobileInput = document.getElementById('number').value;

           
            if (nameInput.trim() === "") {
                alert("Please fill in your Name.");
                return false;
            }

            
            if (emailInput.trim() === "") {
                alert("Please enter your email address.");
                return false;
            }

            if (!emailInput.includes('@') || !emailInput.includes('.')) {
                alert("Enter a valid email (must include @ and .)");
                return false;
            }

            
            if (passInput === "") {
                alert("Please enter a password.");
                return false;
            }

            if (passInput !== confirmPassInput) {
                alert("Passwords do not match!");
                return false;
            }

            
            if (mobileInput.length !== 10 || isNaN(mobileInput)) {
                alert("Enter a valid 10-digit Number");
                return false;
            }

            alert('Submitted Successfully!');
        });
    </script>
</body>

</html>
